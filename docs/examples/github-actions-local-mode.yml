name: CI

on:
  push:
    branches: [ "main" ]

# Every job declares the permissions it needs.
permissions: {}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      # Insert your build process and unit tests here
      # ...

  versioning:
    runs-on: ubuntu-latest
    needs: build-and-test
    # Required to push the tag with the workflow token
    permissions:
      contents: write
    outputs:
      # Outputs are prefixed with the uppercased branch name
      release: ${{ steps.go-semver.outputs.MAIN_NEW_RELEASE }}
      semver: ${{ steps.go-semver.outputs.MAIN_SEMVER }}
    steps:
      # Credentials are kept in this job since the tag is pushed with Git below
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0 # Fetches tags

      - name: Install SLSA verifier
        uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6 # v2.7.1

      # Install Go Semver Release, verifying its provenance before running it
      - name: Install Go Semver Release
        env:
          VERSION: v8.0.3
          ASSET: go-semver-release-linux-amd64
        run: |
          base_url="https://github.com/s0ders/go-semver-release/releases/download/${VERSION}"
          curl -fsSLO "${base_url}/${ASSET}"
          curl -fsSLO "${base_url}/${ASSET}.intoto.jsonl"
          slsa-verifier verify-artifact "${ASSET}" \
            --provenance-path "${ASSET}.intoto.jsonl" \
            --source-uri github.com/s0ders/go-semver-release \
            --source-branch main
          chmod +x "${ASSET}"

      # Running in dry-run mode since the remote cannot be tagged by the program in local mode
      - name: Go Semver Release
        id: go-semver
        run: ./go-semver-release-linux-amd64 release . --config .semver.yaml --dry-run

      # Actually pushing the SemVer tag to the remote. The version is passed through the environment rather than
      # interpolated in the script, which would allow script injection.
      - name: Push Tag
        if: ${{ steps.go-semver.outputs.MAIN_NEW_RELEASE == 'true' }}
        env:
          SEMVER: ${{ steps.go-semver.outputs.MAIN_SEMVER }}
        run: |
          git config user.email "go-semver-release@ci.com"
          git config user.name "Go Semver Release"
          git tag --annotate "${SEMVER}" --message "${SEMVER}"
          git push origin "refs/tags/${SEMVER}"

  release:
    runs-on: ubuntu-latest
    needs: versioning
    permissions:
      contents: read
    # Only run this job if a new release was detected
    if: ${{ needs.versioning.outputs.release == 'true' }}
    env:
      # Use it as "${RELEASE_TAG}" in scripts rather than interpolating the expression in them
      RELEASE_TAG: ${{ needs.versioning.outputs.semver }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      # Insert your release process here
      # ...
