name: Security

on:
  push:
    branches: [ "main" ]
  pull_request:
  # Weekly, so that vulnerabilities published for existing dependencies are reported without any code change.
  # CodeQL is not run here: it is configured with the repository's code scanning default setup.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

env:
  GO_VERSION: 1.26.11

# Every job declares the permissions it needs.
permissions: {}

jobs:
  govulncheck:
    name: Go vulnerabilities
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  zizmor:
    name: Workflows audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: zizmor
        uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
