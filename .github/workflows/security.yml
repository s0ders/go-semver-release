name: Security

on:
  push:
    branches: [ "main" ]
  pull_request:
  # Weekly, so that vulnerabilities published for existing dependencies are reported without any code change.
  # CodeQL is not run here: it is configured with the repository's code scanning default setup.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

env:
  GO_VERSION: 1.26.11

# Every job declares the permissions it needs.
permissions: {}

jobs:
  govulncheck:
    name: Go vulnerabilities
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  zizmor:
    name: Workflows audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: zizmor
        uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
