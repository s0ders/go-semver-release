name: CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  GO_VERSION: 1.26.11

# Every job declares the permissions it needs.
permissions: {}

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      # gotestsum v1.13.0
      - name: Go Test
        run: go run gotest.tools/gotestsum@c4a0df2e75a225d979a444342dd3db752b53619f --hide-summary=skipped -- -shuffle=on -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # v5.5.2
        with:
          codecov_yml_path: .github/codecov.yml
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          install-mode: 'goinstall'
          version: 'v2.15.0'

  docker-scan:
    name: Docker scan
    permissions:
      contents: read
    uses: ./.github/workflows/docker-scan.yml

  versioning:
    name: Versioning
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.go-semver.outputs.MAIN_NEW_RELEASE }}
      semver: ${{ steps.go-semver.outputs.MAIN_SEMVER }}
    needs:
      - tests
      - lint
      - docker-scan
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Install SLSA verifier
        uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6 # v2.7.1

      # The binary is given the access token and the signing key below: its provenance is verified first.
      - name: Download and verify latest stable release
        run: bash ./build/download_latest_release.sh

      # Secrets are passed through the environment, never interpolated in scripts or command lines. The key file is
      # created with restricted permissions from the start, in a directory removed at the end of the job.
      - name: Set up GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          umask 077
          key_path="${RUNNER_TEMP}/secrets/private.asc"
          mkdir -p "$(dirname "${key_path}")"
          printf '%s\n' "${GPG_PRIVATE_KEY}" > "${key_path}"
          echo "GO_SEMVER_GPG_KEY_PATH=${key_path}" >> "${GITHUB_ENV}"

      - name: Go Semver Release
        id: go-semver
        env:
          GO_SEMVER_RELEASE_ACCESS_TOKEN: ${{ secrets.GO_SEMVER_RELEASE_ACCESS_TOKEN }}
        run: |
          ./go-semver-release-linux-amd64 release https://github.com/s0ders/go-semver-release.git \
            --config .semver.yaml \
            --gpg-key-path "${GO_SEMVER_GPG_KEY_PATH}" \
            --verbose

      - name: Remove GPG key
        if: always()
        run: rm -rf "${RUNNER_TEMP}/secrets"

  docker-release:
    name: Docker release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      - versioning
    if: ${{ needs.versioning.outputs.release == 'true' }}
    env:
      VERSION: ${{ needs.versioning.outputs.semver }}
      IMAGE: s0ders/go-semver-release
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to Docker Hub
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The image was scanned by the docker-scan job before versioning. Pushed with its build provenance and SBOM
      # attestations.
      - name: Docker push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ./build/Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            APP_VERSION=${{ env.VERSION }}
            APP_BUILD_NUMBER=${{ github.run_id }}
            APP_COMMIT_HASH=${{ github.sha }}
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}

  slsa-build:
    name: SLSA build and release
    # The SLSA generator must be referenced by tag for its provenance to be verifiable.
    uses: slsa-framework/slsa-github-generator/.github/workflows/builder_go_slsa3.yml@v2.1.0
    needs:
      - versioning
      - docker-release
    if: ${{ needs.versioning.outputs.release == 'true' }}
    strategy:
      matrix:
        os:
          - linux
          - windows
          - darwin
        arch:
          - amd64
          - arm64
    permissions:
      id-token: write
      contents: write
      actions: read
    with:
      go-version: "1.26.11"
      config-file: .github/slsa-goreleaser/${{ matrix.os }}-${{ matrix.arch }}.yml
      evaluated-envs: "VERSION:${{ needs.versioning.outputs.semver }}, COMMIT_HASH:${{ github.sha }}, BUILD_NUMBER:${{ github.run_id }}"
      upload-assets: true
      upload-tag-name: ${{ needs.versioning.outputs.semver }}
